# 校内赛安全起步配置。
# ROS运行时使用已重标定的/camera_info；手眼外参已于2026-09-02完成标定。

enemy_color: "red"

#####-----神经网络参数-----#####
yolo_name: yolov5
infer_backend: trt
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
# TensorRT engine is generated on the target Orin from the matching 0708.onnx.
yolov5_trt_engine_path: assets/yolov5_0708_fp16.engine
gpu_id: 0
# OpenVINO fallback setting; OpenVINO's GPU target does not use the Orin GPU.
device: CPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600
use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

#####-----tracker参数-----#####
min_detect_count: 3
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
max_frame_gap_s: 0.25
max_match_distance_m: 0.8

#####-----aimer参数-----#####
# 未完成实车零偏标定前保持为 0。
yaw_offset: 0
pitch_offset: 4
comming_angle: 55
leaving_angle: 20
decision_speed: 7
high_speed_delay_time: 0.0
low_speed_delay_time: 1.0

#####-----shooter参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
# 初次联调禁止自动开火。
auto_fire: false

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

# 标定于 2026-09-02；IMU机体系相对云台系绕Z轴旋转+90度。
R_gimbal2imubody: [0, -1, 0, 1, 0, 0, 0, 0, 1]

# 实车内参备用值；ROS 运行时仍优先使用 /camera_info。
camera_matrix: [3624.80864, 0, 697.58543, 0, 3624.87824, 555.55076, 0, 0, 1]
distort_coeffs: [-0.058562, 1.134172, -0.000550, -0.000459, 0]
# GP-290-20-12*9棋盘格手眼标定；数据目录：20260902_202026。
R_camera2gimbal:
  [
    -0.01742639,
    -0.03329257,
    0.99929371,
    -0.99983224,
    -0.00505738,
    -0.01760427,
    0.00563990,
    -0.99943285,
    -0.03319885,
  ]
t_camera2gimbal: [0.08431228, -0.00557515, -0.05248432]

#####-----旧CAN接口参数（保留供上游程序编译）-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----校内赛串口参数-----#####
com_port: "/dev/robomaster"
baudrate: 115200

# 原上游配置中部分调试程序会读取这些参数。
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
# 设为 0 可确保初次联调时 Planner 不会给出开火指令。
fire_thresh: 0.0
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff参数（保留供上游目标编译）-----#####
model: "assets/yolo11_buff_int8.xml"
fire_gap_time: 0.700
predict_time: 0.120
